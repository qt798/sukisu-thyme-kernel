name: build-thyme-sukisu
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libncurses-dev lz4 lzop device-tree-compiler zip unzip python3 cpio git curl clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: fetch kernel source
        run: |
          set -euxo pipefail
          curl -L --retry 5 --retry-all-errors -o src.tar.gz "https://codeload.github.com/AstideLabs/android_kernel_xiaomi_sm8250/tar.gz/refs/heads/android17-aptusitu-new"
          mkdir -p kernel
          tar xzf src.tar.gz -C kernel --strip-components=1
          cp kernel/arch/arm64/configs/vendor/kona-perf_defconfig kernel/arch/arm64/configs/thyme_defconfig
      - name: integrate sukisu
        run: |
          set -euxo pipefail
          cd kernel
          git clone --depth 1 -b v3.0.0 https://github.com/SukiSU-Nova/SukiSU-Nova KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
      - name: patch for kernel 4.19
        run: |
          set -euxo pipefail
          cd kernel
          grep -rl "MODULE_IMPORT_NS" drivers/kernelsu | xargs -r sed -i 's/MODULE_IMPORT_NS([^)]*);/;/g'
          T=techpack/audio/asoc/codecs/tfa98xx
          if [ ! -f "$T/src/config.h" ]; then cp "$T/inc/config.h" "$T/src/config.h"; fi
          python3 - <<'PY'
          import sys
          def load(p):
              return open(p).read()
          def save(p, s):
              open(p, 'w').write(s)
          def rep(s, old, new):
              if old not in s:
                  sys.exit('anchor missing: ' + old[:60])
              return s.replace(old, new, 1)
          p = 'drivers/kernelsu/infra/file_wrapper.c'
          s = load(p)
          s = rep(s, "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)\nstatic int ksu_wrapper_iopoll",
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)\nstatic int ksu_wrapper_iopoll")
          s = rep(s, "    return orig->f_op->iopoll(kiocb, spin);\n}\n#endif",
                  "    return orig->f_op->iopoll(kiocb, spin);\n}\n#endif\n#endif")
          s = rep(s, "    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;",
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n#endif")
          s = rep(s, "static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out,",
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)\nstatic loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out,")
          s = rep(s, "        return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);\n    }\n}",
                  "        return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);\n    }\n}\n#endif")
          s = rep(s, "    p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;",
                  "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)\n    p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;\n#endif")
          save(p, s)
          p = 'drivers/kernelsu/infra/su_mount_ns.c'
          s = load(p)
          s = rep(s, "#include <uapi/linux/mount.h>", "#include <linux/mount.h>")
          save(p, s)
          p = 'drivers/kernelsu/infra/seccomp_cache.c'
          s = load(p)
          stub = """#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)
          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }

          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr)
          {
              (void)filter;
              (void)nr;
          }
          #else
          """
          s = rep(s, "struct action_cache {", stub + "struct action_cache {")
          s = s + "\n#endif\n"
          save(p, s)
          p = 'drivers/kernelsu/manager/pkg_observer.c'
          s = load(p)
          I = s.index('static int ksu_handle_inode_event')
          J = s.index('static const struct fsnotify_ops ksu_ops = {')
          K = s.index('};', J) + 2
          old_fn = s[I:J]
          new_block = """#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)
          """ + old_fn + """static const struct fsnotify_ops ksu_ops = {
              .handle_inode_event = ksu_handle_inode_event,
          };
          #else
          static int ksu_handle_event(struct fsnotify_group *group, struct inode *inode, u32 mask, const void *data, int data_type, const unsigned char *file_name, u32 cookie, struct fsnotify_iter_info *iter_info)
          {
              if (!file_name)
                  return 0;
              if (mask & FS_ISDIR)
                  return 0;
              if (!memcmp(file_name, "packages.list", 13)) {
                  pr_info("packages.list detected: %d\\n", mask);
                  ksu_defer_track_throne();
              }
              return 0;
          }

          static const struct fsnotify_ops ksu_ops = {
              .handle_event = ksu_handle_event,
          };
          #endif
          """
          save(p, s[:I] + new_block + s[K:])
          print('4.19 patches applied')
          PY
      - name: configure
        run: |
          set -euxo pipefail
          cd kernel
          make O=out ARCH=arm64 thyme_defconfig
          ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e KPROBES -e KALLSYMS -e KALLSYMS_ALL -e MODULES -e EXT4_FS -e OVERLAY_FS -d KSU_SUSFS
          make O=out ARCH=arm64 olddefconfig
          grep -E '^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|MODULES|EXT4_FS)' out/.config
      - name: prepare selinux headers
        run: |
          cd kernel
          make O=out ARCH=arm64 -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- security/selinux/ > /dev/null 2>&1 || true
      - name: quick check sukisu build
        run: |
          cd kernel
          FL=$(find out -name flask.h | head -n 1)
          echo "flask.h at ${FL}"
          INC="-I$(pwd)/security/selinux/include -I$(pwd)/security/selinux -I$(pwd)/out/security/selinux"
          make O=out ARCH=arm64 -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="$INC -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types" -k drivers/kernelsu/ > /tmp/ksu.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then exit $RC; fi
          echo "kernelsu objects built ok"
      - name: build image
        run: |
          cd kernel
          INC="-I$(pwd)/security/selinux/include -I$(pwd)/security/selinux -I$(pwd)/out/security/selinux"
          make O=out ARCH=arm64 -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="$INC -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types" Image > /tmp/img.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then exit $RC; fi
          ls -l out/arch/arm64/boot/Image
      - name: pack anykernel3
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' anykernel.sh
          rm -rf .git .github
          cd ..
          (cd ak3 && zip -r9 ../AK3_thyme_sukisu.zip .)
          ls -l AK3_thyme_sukisu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AK3-thyme-sukisu
          path: |
            AK3_thyme_sukisu.zip
            kernel/out/.config
      - name: save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/ksu.log
            /tmp/img.log


