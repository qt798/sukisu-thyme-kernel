name: build-thyme-sukisu
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libncurses-dev lz4 lzop device-tree-compiler zip unzip python3 cpio git curl clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: fetch kernel source
        run: |
          set -euxo pipefail
          curl -L --retry 5 --retry-all-errors -o src.tar.gz "https://codeload.github.com/AstideLabs/android_kernel_xiaomi_sm8250/tar.gz/refs/heads/android17-aptusitu-new"
          mkdir -p kernel
          tar xzf src.tar.gz -C kernel --strip-components=1
          cp kernel/arch/arm64/configs/vendor/kona-perf_defconfig kernel/arch/arm64/configs/thyme_defconfig
          ls -l kernel/arch/arm64/configs/thyme_defconfig
      - name: integrate sukisu
        run: |
          set -euxo pipefail
          cd kernel
          git clone --depth 1 -b v3.0.0 https://github.com/SukiSU-Nova/SukiSU-Nova KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -rn "drivers/kernelsu/Kconfig" drivers/Kconfig
      - name: patch for kernel 4.19
        run: |
          set -euxo pipefail
          cd kernel
          grep -rl "MODULE_IMPORT_NS" drivers/kernelsu | xargs -r sed -i 's/MODULE_IMPORT_NS([^)]*);/;/g'
          T=techpack/audio/asoc/codecs/tfa98xx
          if [ ! -f "$T/src/config.h" ]; then cp "$T/inc/config.h" "$T/src/config.h"; fi
          python3 - <<'PY'
          import sys
          p = 'drivers/kernelsu/infra/file_wrapper.c'
          s = open(p).read()
          def rep(old, new):
              global s
              if old not in s:
                  sys.exit('anchor missing: ' + old[:60])
              s = s.replace(old, new, 1)
          rep("#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)\nstatic int ksu_wrapper_iopoll",
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 1, 0)\nstatic int ksu_wrapper_iopoll")
          rep("    return orig->f_op->iopoll(kiocb, spin);\n}\n#endif",
              "    return orig->f_op->iopoll(kiocb, spin);\n}\n#endif\n#endif")
          rep("    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;",
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 1, 0)\n    p->ops.iopoll = fp->f_op->iopoll ? ksu_wrapper_iopoll : NULL;\n#endif")
          rep("static loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out,",
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)\nstatic loff_t ksu_wrapper_remap_file_range(struct file *file_in, loff_t pos_in, struct file *file_out, loff_t pos_out,")
          rep("        return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);\n    }\n}",
              "        return orig->f_op->remap_file_range(orig, pos_in, file_out, pos_out, len, remap_flags);\n    }\n}\n#endif")
          rep("    p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;",
              "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)\n    p->ops.remap_file_range = fp->f_op->remap_file_range ? ksu_wrapper_remap_file_range : NULL;\n#endif")
          open(p, 'w').write(s)
          print('patched file_wrapper.c')
          PY
      - name: configure
        run: |
          set -euxo pipefail
          cd kernel
          make O=out ARCH=arm64 thyme_defconfig
          ./scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK -e KPROBES -e KALLSYMS -e KALLSYMS_ALL -e MODULES -e EXT4_FS -e OVERLAY_FS -d KSU_SUSFS
          make O=out ARCH=arm64 olddefconfig
          grep -E '^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|MODULES|EXT4_FS)' out/.config
      - name: quick check sukisu build
        run: |
          set -euxo pipefail
          cd kernel
          make O=out ARCH=arm64 -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types" drivers/kernelsu/
          echo "kernelsu objects built ok"
      - name: build image
        run: |
          set -euxo pipefail
          cd kernel
          make O=out ARCH=arm64 -j"$(nproc)" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types" Image
          ls -l out/arch/arm64/boot/Image
      - name: pack anykernel3
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' anykernel.sh
          rm -rf .git .github
          cd ..
          (cd ak3 && zip -r9 ../AK3_thyme_sukisu.zip .)
          ls -l AK3_thyme_sukisu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AK3-thyme-sukisu
          path: |
            AK3_thyme_sukisu.zip
            kernel/out/.config
